%YAML:1.0

# D435i infrared stereo + IMU, generated from:
# d435i_ir_stereo_imu_no_emitter-report-cam.pdf
# d435i_ir_stereo_imu_no_emitter-report-imucam.pdf

# common parameters
imu: 1
num_of_cam: 2

imu_topic: "/camera/camera/imu"
image0_topic: "/camera/camera/infra1/image_rect_raw"
image1_topic: "/camera/camera/infra2/image_rect_raw"
output_path: "/tmp/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480

# GPU acceleration
# NOTE: GPU optical flow is untested on Jetson and was measured to diverge
# badly on this device (see README "Known Issues"). Keep CPU mode.
use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

# Extrinsic parameter between IMU/body and camera.
# Kalibr report T_ic: cam -> imu. VINS uses body_T_cam in the same direction.
estimate_extrinsic: 0

# body_T_cam0 from d435i_calib_ros1 Kalibr (T_ic: cam0 to imu0)
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99987084, 0.01231050, 0.01033254, -0.00620498,
           -0.01232534, 0.99992310, 0.00137373, 0.00419113,
           -0.01031484, -0.00150090, 0.99994567, 0.01576186,
           0.0, 0.0, 0.0, 1.0 ]

# image1_topic is image_rect_raw. The right rectified camera is represented as
# cam0 plus the RealSense CameraInfo baseline, then transformed by body_T_cam0.
# body_T_cam1 from d435i_calib_ros1 Kalibr (T_ic: cam1 to imu0)
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99990824, 0.01212888, 0.00603354, 0.04408959,
           -0.01213689, 0.99992551, 0.00129282, 0.00364518,
           -0.00601741, -0.00136593, 0.99998096, 0.01527539,
           0.0, 0.0, 0.0, 1.0 ]

# Multiple thread support
multiple_thread: 0

# feature tracker parameters
max_cnt: 120
min_dist: 15
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

# optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 7.0

# IMU parameters from Kalibr report
acc_n: 0.006
gyr_n: 0.0004
acc_w: 0.0002
gyr_w: 0.000004
g_norm: 9.8065

# unsynchronization parameters (from d435i_calib_ros1 Kalibr)
# timeshift cam0 to imu0: t_imu = t_cam + shift
estimate_td: 0
td: -0.0007105538326216687

# loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/pose_graph/"
save_image: 0
